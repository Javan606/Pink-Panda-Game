name: Build Pink Panda 3D IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Get game
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir -p build
          unzip -q PinkPanda3D_source.zip -d build
          test -f build/project.yml
          test -f build/App/Resources/index.html

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile iPhone app
        run: |
          cd build
          xcodegen generate
          xcodebuild -project PinkPanda3D.xcodeproj -scheme PinkPanda3D -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PinkPandaDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          mkdir -p Package/Payload
          cp -R "$RUNNER_TEMP/PinkPandaDerivedData/Build/Products/Release-iphoneos/PinkPanda3D.app" Package/Payload/
          test -f Package/Payload/PinkPanda3D.app/PinkPanda3D
          (cd Package && zip -qry ../PinkPanda3D-unsigned.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PinkPanda3D-unsigned-IPA
          path: PinkPanda3D-unsigned.ipa
          if-no-files-found: error
